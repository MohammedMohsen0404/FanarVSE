name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton numpy pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (GPU tests are skipped on runners without CUDA)
        run: pytest -v
